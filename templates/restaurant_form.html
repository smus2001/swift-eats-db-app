<!DOCTYPE html>
<html>
<head>
  <title>{{ 'Edit' if editing else 'Add' }} Restaurant</title>
</head>
<body>
  <h1>{{ 'Edit' if editing else 'Add' }} Restaurant</h1>
  {% if error %}
    <p style="color: red;">{{ error }}</p>
  {% endif %}
  <form method="post">
    <p>Code (6 characters):<br>
      <input name="restaurant_code" maxlength="6" required placeholder="e.g. KAGI01"
             value="{{ v.get('restaurant_code', '') }}"></p>
    <p>Name:<br>
      <input name="restaurant_name" required value="{{ v.get('restaurant_name', '') }}"></p>
    <p>Area:<br>
      <select name="area_id" required>
        {% for a in areas %}
          <option value="{{ a.area_id }}"
            {% if a.area_id|string == v.get('area_id', '')|string %}selected{% endif %}>
            {{ a.city_name }} - {{ a.area_name }}</option>
        {% endfor %}
      </select></p>
    <p>Address block:<br>
      <input name="address_block" required maxlength="20" value="{{ v.get('address_block', '') }}"></p>
    <p>Category:<br>
      <select name="category" required>
        {% for c in categories %}
          <option {% if c == v.get('category') %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select></p>
    <p>Price bracket:<br>
      <select name="cost_bracket" required>
        {% for b in ['$', '$$', '$$$', '$$$$'] %}
          <option {% if b == v.get('cost_bracket') %}selected{% endif %}>{{ b }}</option>
        {% endfor %}
      </select></p>
    <p>Average cost per item:<br>
      <input name="avg_cost_per_item" type="number" step="0.01" min="1" required
             value="{{ v.get('avg_cost_per_item', '') }}"></p>
    <p>Rating (1.0 to 5.0):<br>
      <input name="rating" type="number" step="0.1" min="1" max="5" required
             value="{{ v.get('rating', 4.0) }}"></p>
    {% if editing %}
      <p><label><input type="checkbox" name="is_active" {% if v.get('is_active') %}checked{% endif %}>
        Active</label></p>
    {% endif %}
    <button type="submit">Save</button>
    <a href="/restaurants">Cancel</a>
  </form>
</body>
</html>
